[client]
# Hide Streamlit's developer toolbar and error tracebacks from users.
toolbarMode = "viewer"
showErrorDetails = "none"
showSidebarNavigation = true

[browser]
# Never send usage statistics to Streamlit / Snowflake.
gatherUsageStats = false

[server]
headless = true
runOnSave = false
fileWatcherType = "none"
enableXsrfProtection = true
maxUploadSize = 5
port = 8501

[runner]
magicEnabled = false

[theme]
base = "light"
primaryColor = "#1D4ED8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
